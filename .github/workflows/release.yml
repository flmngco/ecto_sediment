name: Release

# When a GitHub release is published: checks it, runs the full CI against
# sediment from Hex and publishes to Hex. HEX_API_KEY exists only in the
# `hex` environment (tags v* only, a required reviewer), whose job runs no
# code from this repository; see RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The tag must be v<version in mix.exs>, the CHANGELOG must have that
  # version's entry, and the tagged commit must be on main.
  verify:
    name: Check the tag, the CHANGELOG and the branch
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "tag $TAG doesn't match mix.exs version $version"; exit 1
          fi
          if ! grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $version"; exit 1
          fi
          if grep -qE "^## ${version//./\\.} \(unreleased\)" CHANGELOG.md; then
            echo "CHANGELOG.md still marks $version as unreleased"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "the tagged commit is not on main"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The full CI from a clean build (no caches) against sediment from Hex, as
  # the package will be used. No secrets.
  ci:
    name: mix ci against sediment from Hex
    needs: verify
    runs-on: ubuntu-24.04
    services:
      seaweedfs:
        # pinned: newer images refuse anonymous S3 requests (403) by default
        image: chrislusf/seaweedfs:4.48
        ports:
          - 8333:8333
    env:
      SEDIMENT_HEX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.1"
          otp-version: "29.0"

      - name: Check that the required sediment version is on Hex
        run: |
          constraint="$(sed -n 's/.*{:sediment, "\(.*\)"}.*/\1/p' mix.exs)"
          echo "sediment $constraint"
          if ! mix deps.get; then
            echo "no sediment release on Hex matches $constraint: publish sediment first"
            exit 1
          fi

      - name: Wait for SeaweedFS
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:8333/ci-probe || true)
            [ "$code" = "200" ] && exit 0
            sleep 1
          done
          echo "SeaweedFS did not come up"; exit 1

      - name: mix ci
        run: mix ci

  # Builds the Hex package and its docs. Building the docs compiles the
  # project and its dependencies, so this job gets no secrets.
  package:
    name: Build the Hex package and docs
    needs: [verify, ci]
    runs-on: ubuntu-24.04
    env:
      SEDIMENT_HEX: "1"
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.1"
          otp-version: "29.0"

      - run: mix deps.get

      # The docs tarball holds what `mix hex.publish` would upload: every
      # file under doc/ except dotfiles, with paths relative to doc/.
      - name: Build
        run: |
          mkdir hex
          mix hex.build --output "hex/ecto_sediment-$VERSION.tar"
          mix docs
          (cd doc && find . -type f ! -path '*/.*' -printf '%P\n' | sort | tar -czf "../hex/ecto_sediment-$VERSION-docs.tar.gz" -T -)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hex
          path: hex/
          if-no-files-found: error

  # Holds HEX_API_KEY. It checks nothing out and runs no code from this
  # repository: it uploads the finished package and docs through the Hex API.
  publish:
    name: Publish to Hex
    needs: [verify, package]
    runs-on: ubuntu-24.04
    environment: hex
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hex
          path: hex

      # The key goes to curl on stdin, not on its command line.
      - name: Publish the package and the docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          upload() {
            printf 'authorization: %s\n' "$HEX_API_KEY" |
              curl --fail-with-body -sS -H @- -H 'content-type: application/octet-stream' \
                -H 'accept: application/json' --data-binary "@$1" "$2"
            echo
          }
          upload "hex/ecto_sediment-$VERSION.tar" "https://hex.pm/api/packages/ecto_sediment/releases?replace=false"
          upload "hex/ecto_sediment-$VERSION-docs.tar.gz" "https://hex.pm/api/packages/ecto_sediment/releases/$VERSION/docs"
